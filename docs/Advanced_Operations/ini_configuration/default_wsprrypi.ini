[Meta]
debug_logging = False

[Security]
; Privileged Network Safety:
; Restricts privileged browser operations to directly connected LANs.
; Only the exact value insecure-disabled turns this network-location check off.
; Normal configuration autosave does not modify this setting.
Privileged Network Safety = enforced

[Operation]
; Mode:
; Active transmit mode.
; Valid values:
;   WSPR
;   QRSS
;   FSKCW
;   DFCW
Mode = WSPR

; Transmit:
; Global RF transmit gate. False prevents transmission and scheduling.
Transmit = False

; Enable on Boot: Never, Always, or Previous.
; Startup inhibition and RP1 idle restoration still take precedence.
Enable on Boot = Never

; Transmit Backend:
; RF transmit backend.
; Valid values:
;   gpio    - Raspberry Pi GPCLK/PWM RF output
;   si5351  - Si5351 clock-generator RF output
Transmit Backend = gpio

; Use LED:
; Enable status LED output.
Use LED = False

; LED Pin:
; BCM GPIO used for LED status output.
LED Pin = 18

; Use Amp:
; Enables optional external amplifier control.
Use Amp = false

; Amp Pin:
; BCM GPIO used for optional external amplifier control.
; Leave blank to disable amplifier control.
Amp Pin =

; Amp Pin Active High:
; Controls amplifier GPIO polarity.
Amp Pin Active High = false

; Web Port:
; Port used for REST interface.
Web Port = 31415

; Socket Port:
; Port used for WebSocket interface.
Socket Port = 31416

; Use Shutdown:
; Enable shutdown button monitoring.
Use Shutdown = False

; Shutdown Button:
; BCM GPIO used for shutdown trigger.
Shutdown Button = 19


[Experimental]
; Advanced CLI/INI-only frequency policy. These settings do not grant legal
; authority to transmit and are not shown in the Web UI.
Allow Unqualified Frequency = false
; Frequencies outside recognized amateur bands require both settings to be true.
Allow Non-Amateur Frequency = false


[Calibration]
; PPM:
; Frequency calibration in parts per million.
; Used only by the Si5351 backend.
; Modeled reference = Reference Frequency * (1 - PPM / 1000000).
PPM = 0.0


[GPIO]
; Transmit Pin:
; BCM GPIO used for RF output when Transmit Backend = gpio.
; GPCLK0 is supported on BCM GPIO 4 or 20.
; The selected pin is reserved from enabled Band GPIO, LED, shutdown, and amp roles,
; even when Operation.Transmit is false.
; Ignored by the Si5351 backend.
Transmit Pin = 4

; Power Level:
; GPIO backend RF output power setting.
; Valid range is 0 to 7.
Power Level = 7

; Use System Clock Frequency Estimate:
; Apply the signed clock-rate estimate from a supported provider to GPIO.
; WsprryPi currently supports Chrony. Provider configuration remains an
; administrator responsibility outside WsprryPi.
Use System Clock Frequency Estimate = True

; Frequency Residual PPM:
; Remaining conducted RF error measured while the provider estimate is active.
; Added to a usable current or permitted stale provider estimate.
; This is additional correction; the intrinsic chipset term is applied once.
Frequency Residual PPM = 0.0

; Manual PPM:
; Additional fallback when the estimate is disabled or no usable current or
; bounded prior-qualified estimate remains. Zero retains intrinsic correction.
; Positive means the GPIO source clock runs fast; negative means it runs slow.
Manual PPM = 0.0


[Si5351]
; I2C Bus:
; Linux I2C bus number for the Si5351 device.
; Bus 1 usually maps to /dev/i2c-1 on Raspberry Pi systems.
I2C Bus = 1

; I2C Address:
; 7-bit Si5351 I2C address.
; 0x60 is the common default for many Si5351 breakout boards.
I2C Address = 0x60

; Reference Frequency:
; Si5351 crystal or reference input frequency in Hz.
; Typical modules use 27000000.
Reference Frequency = 27000000

; Reference Source:
; Use external_tcxo for an active external clock or TCXO, or crystal for a
; passive crystal connected across XA/XB.
Reference Source = external_tcxo

; Crystal Load Capacitance:
; Used only for a passive crystal. Valid values are 6, 8, or 10 pF.
Crystal Load Capacitance = 10

; TX Output:
; Si5351 clock output used for transmit RF.
; Valid values:
;   CLK0
;   CLK1
;   CLK2
; Unused outputs are held in a safe non-transmitting state by WsprryPi.
; The internal parked PLL is a synthesis state, not an emitted parked RF output.
; This setting is configurable in INI and CLI; it is not exposed in the web UI.
TX Output = CLK0

; Power Level:
; Si5351 backend drive-strength level.
; Valid range is 1 to 4.
; Levels 1/2/3/4 retain 2/4/6/8 mA drive, not calibrated RF power.
Power Level = 1


[WSPR]
; Call Sign:
; Your amateur radio callsign.
; Supports standard, compound, and extended WSPR formats.
Call Sign = NXXX

; Grid Square:
; Your Maidenhead grid locator.
Grid Square = ZZ99

; TX Power:
; Transmitter power in dBm.
TX Power = 20

; Frequency:
; WSPR bare or qualified preset, or USB dial frequency in Hz.
Frequency = 20m

; Frequency Profile:
; Default convention used by bare WSPR preset names.
; Valid values: existing_common, wrc15
Frequency Profile = existing_common

; Band Preferences:
; One-line JSON object mapping a canonical band to either a quoted built-in
; preset for the same band or a positive integral numeric USB dial frequency.
; Examples: {"60m":"60m:wrc15"} or {"8m":40680000,"5m":60000000}
; Use {} to follow the selected profile for every bare band preset.
; A numeric preference must correlate back to its canonical band.
Band Preferences = {}

; Planner Preference:
; Controls how WsprryPi selects between single-frame and paired WSPR transmissions.
; Valid values:
;   auto
;   prefer_paired
;   require_paired
Planner Preference = auto

; Use Random Offset:
; Select one uniform placement within +/-80 Hz per prepared WSPR plan.
; Both frames of a pair retain it; each independent plan takes a fresh draw.
; A fresh draw may repeat. False uses zero. Test Tone uses no random placement.
; Nominal placement is separate from calibration and measured RF.
Use Random Offset = True


[CW]
; Message:
; Text transmitted by QRSS, FSKCW, or DFCW when the selected mode is non-WSPR.
; Numeric-looking text such as 73 remains a text message.
Message = 73

; Base Frequency:
; Base RF frequency for non-WSPR modes.
; Use whole-number Hz, or add Hz, kHz, MHz, or GHz to decimal values.
; QRSS transmits on this frequency.
; FSKCW uses this as the space frequency.
; DFCW uses this as the dot frequency.
Base Frequency = 14096900

; Shift Hz:
; Frequency shift in Hz for keyed dual-frequency CW modes.
; FSKCW mark frequency = Base Frequency + Shift Hz.
; DFCW dash frequency = Base Frequency + Shift Hz.
; QRSS ignores this field.
Shift Hz = 5

; Dot Seconds:
; Dot length in seconds for QRSS, FSKCW, and DFCW timing.
Dot Seconds = 3.0

; Intra Element Gap:
; QRSS/FSKCW gap between dots and dashes, expressed as a multiple of Dot Seconds.
Intra Element Gap = 1.0

; Inter Character Gap:
; QRSS/FSKCW gap between characters, expressed as a multiple of Dot Seconds.
Inter Character Gap = 3.0

; Inter Word Gap:
; QRSS/FSKCW gap between words, expressed as a multiple of Dot Seconds.
Inter Word Gap = 7.0

; DFCW Intra Element Gap:
; DFCW gap between equal-duration dot/dash symbols, expressed as a multiple of Dot Seconds.
; DFCW dot and dash symbols have the same duration and differ by frequency.
DFCW Intra Element Gap = 0.333333

; DFCW Inter Character Gap:
; DFCW gap between characters, expressed as a multiple of Dot Seconds.
DFCW Inter Character Gap = 1.0

; DFCW Inter Word Gap:
; DFCW gap between words, expressed as a multiple of Dot Seconds.
DFCW Inter Word Gap = 3.0

; Fade Shape:
; Requested envelope shape for QRSS, FSKCW, and DFCW events.
; Si5351 uses full-drive duty-cycle chopping, not analog amplitude control.
; Valid values: none, linear, raised_cosine.
Fade Shape = raised_cosine

; Fade In Ms:
; RF envelope fade-in duration in milliseconds.
Fade In Ms = 20

; Fade Out Ms:
; RF envelope fade-out duration in milliseconds.
Fade Out Ms = 20

; Fade Slice Ms:
; Advanced envelope approximation control for QRSS, FSKCW, and DFCW fades.
; Smaller positive values increase switching cost; no RF smoothness guarantee.
; Expired slices are skipped within the event deadline, not replayed.
; This does not change Fade In Ms or Fade Out Ms duration.
Fade Slice Ms = 2

; Start Minute:
; Minute after the top of the hour for scheduled QRSS/FSKCW/DFCW launches.
; Valid range: 0 to 59.
Start Minute = 0

; Start Second: seconds after the scheduled start minute, 0 through 59.
Start Second = 5

; Repeat Minutes:
; Repeat interval in minutes for scheduled QRSS/FSKCW/DFCW launches.
; Must be greater than 0.
Repeat Minutes = 10


