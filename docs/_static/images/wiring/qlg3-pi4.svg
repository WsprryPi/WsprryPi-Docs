<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">QLG3 GPS to Raspberry Pi 4 wiring</title>
<desc id="desc">VDD and VBAT join to physical pin 1 at 3.3 volts. Ground connects to pin 6. GPS TX connects to pin 10, GPIO15 receive. PPS connects to pin 12, GPIO18.</desc>
<rect width="960" height="420" rx="12" fill="#fff"/>
<g font-family="sans-serif" fill="#263b4d">
<text x="55" y="45" font-size="25" font-weight="bold">QRP Labs QLG3</text>
<text x="575" y="45" font-size="25" font-weight="bold">Raspberry Pi 4</text>
<g font-size="21">
<text x="55" y="110">VDD</text><text x="55" y="165">VBAT</text><text x="55" y="230">GND</text><text x="55" y="295">TX</text><text x="55" y="360">PPS</text>
<text x="575" y="110">Pin 1 · 3.3 V</text><text x="575" y="230">Pin 6 · Ground</text><text x="575" y="295">Pin 10 · GPIO15 / RXD</text><text x="575" y="360">Pin 12 · GPIO18 / PPS</text>
</g></g>
<g fill="none" stroke-width="4" stroke-linejoin="round">
<path d="M140 103H540 M140 158H260V103" stroke="#a63446"/>
<path d="M140 223H540" stroke="#263b4d"/>
<path d="M140 288H540" stroke="#3459a0"/>
<path d="M140 353H540" stroke="#286c55"/>
</g><circle cx="260" cy="103" r="6" fill="#a63446"/>
<text x="55" y="400" font-family="sans-serif" font-size="17" fill="#495057">Pi numbers are physical header pins; GPIO numbers use BCM numbering.</text>
</svg>
