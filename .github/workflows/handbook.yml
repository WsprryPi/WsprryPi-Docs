# SPDX-License-Identifier: MIT
name: Handbook validation

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]

permissions:
  contents: read

jobs:
  handbook:
    name: HTML and extension tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      READTHEDOCS_VERSION: devel
      READTHEDOCS_GIT_IDENTIFIER: ${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out handbook
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Python matching Read the Docs
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install handbook dependencies
        run: |
          python -m venv docs/.venv
          source docs/.venv/bin/activate
          python -m pip install --disable-pip-version-check -r docs/requirements.txt
          python -m pip check
      - name: Test Sphinx extensions
        run: |
          source docs/.venv/bin/activate
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build the complete handbook with warnings as errors
        run: |
          source docs/.venv/bin/activate
          python -m sphinx -E -a -b html -n -W --keep-going docs docs/_build/html
